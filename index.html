<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Income Expense App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @theme{
        --font-Bree-serif: "Bree Serif", serif;
        }
    </style>
    <link rel="shortcut icon"
        href="https://static.vecteezy.com/system/resources/thumbnails/037/230/736/small/rupee-currency-money-coin-piece-coin-illustration-free-png.png"
        type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class=" font-Bree-serif ">
        <header class="p-3 bg-gradient-to-r from-slate-900 to-slate-700  ">
            <h1 class="text-3xl text-center text-white">Income Expense Calculator</h1>
            <div
                class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-3 gap-6 p-6 text-center max-w-[1000px] mr-auto ml-auto">
                <div
                    class="block max-w-sm p-6 bg-white border border-gray-200 rounded-lg shadow-sm hover:bg-gray-100 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700">
                    <h4 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Total Income</h4>
                    <h5 class="font-normal text-gray-700 dark:text-gray-400">₹ <span id="totalIncome">0</span>
                    </h5>
                </div>
                <div
                    class="block max-w-sm p-6 bg-white border border-gray-200 rounded-lg shadow-sm hover:bg-gray-100 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700">
                    <h4 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Total Expense</h4>
                    <h5 class="font-normal text-gray-700 dark:text-gray-400">₹ <span id="totalExpense">0</span></h5>
                </div>
                <div
                    class="block max-w-sm p-6 bg-white border border-gray-200 rounded-lg shadow-sm hover:bg-gray-100 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700">
                    <h4 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Net Balance</h4>
                    <h5 class="font-normal text-gray-700 dark:text-gray-400">₹ <span id="netBalance">0</span></h5>
                </div>
            </div>
        </header>
        <main class="m-5 grid gap-4 grid-cols-12 md:grid-cols-12 ">
            <section class="col-span-12 md:col-span-4">
                <form id="form" class="border-1 p-5">
                    <h1 class="text-2xl text-left mt-2 mb-3" id="heading">Add Money </h1>
                    <input type="hidden" id="id" value="">
                    <div class="mb-2">
                        <label for="description"
                            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Description</label>
                        <input type="text" id="description"
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                            placeholder="Enter Description" />
                    </div>
                    <div class="mb-2">
                        <label for="amount"
                            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Amount</label>
                        <input type="number" id="amount"
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                            placeholder="Enter Amount" />
                    </div>
                    <div class="mb-2">
                        <label for="type"
                            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Type</label>
                        <select id="type"
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <p id="error" class="text-red-600"></p>
                    <div class="mt-4 flex">
                        <button type="submit" id="submitBtn"
                            class="px-3 py-2 text-sm focus:outline-none text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:ring-green-300 font-medium rounded-sm text-sm px-5 py-2.5 me-2 mb-2 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">Submit</button>
                        <button type="button" id="resetBtn"
                            class="px-3 py-2 text-sm text-white bg-gray-800 hover:bg-gray-900 focus:outline-none focus:ring-4 focus:ring-gray-300 font-medium rounded-sm text-sm px-5 py-2.5 me-2 mb-2 dark:bg-gray-800 dark:hover:bg-gray-700 dark:focus:ring-gray-700 dark:border-gray-700">Reset</button>
                    </div>
                </form>
            </section>
            <section class="col-span-12 md:col-span-8 ">
                <h2 class="text-2xl">Income/Expense Report</h2>
                <div class="m-2">
                    <div class="mt-3 space-x-4 flex justify-center w-[100%]" id="filterGroup">
                        <label class="inline-flex items-center">
                            <input type="radio" name="filterOption" value="all" class="form-radio text-indigo-600"
                                checked>
                            <span class="ml-2">All</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="filterOption" value="income" class="form-radio text-indigo-600">
                            <span class="ml-2">Income</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="filterOption" value="expense" class="form-radio text-indigo-600">
                            <span class="ml-2">Expense</span>
                        </label>
                    </div>
                    <div id="reports" class="border">
                        <h2 class="text-xl text-black-10 text-center mt-5" id="noData">No Data</h2>
                    </div>
                </div>
            </section>
        </main>
        <footer>
        </footer>
    </div>
</body>
<script src="script.js"></script>

</html>
